name: Release

on:
  # Publish a release when a version tag is pushed.
  push:
    tags:
      - "v*"

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'poetry'

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run pylint
        run: poetry run pylint aiocomfoconnect/*.py

      - name: Check formatting with black
        run: poetry run black --check aiocomfoconnect/*.py

      - name: Run pytest
        run: poetry run pytest --verbose

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # Only publish when the lint and tests pass on the tagged commit.
    needs: checks
    permissions:
      contents: read
      # Required to authenticate against PyPI through OIDC, so no API token is needed.
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'poetry'

      - name: Set the version from the tag
        run: poetry version "${GITHUB_REF_NAME#v}"

      - name: Build
        run: poetry build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Create the GitHub release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Create the release with generated release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes
